name: mentalhealthai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
    
  usage_stats: ^1.3.0

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Networking
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.5.4

  # Sensors (Accelerometer/Gyroscope)
  sensors_plus: ^4.0.0

  # Audio
  audioplayers: ^6.0.0

  # Physics / Game Engine
  flame: ^1.18.0
  flame_forge2d: ^0.18.0

  # Date/Time
  intl: ^0.19.0

  # Image
  image_picker: ^1.2.1

  # Video
  youtube_player_flutter: ^9.1.3
  video_player: ^2.8.2

  # Animations
  confetti: ^0.8.0

  # Charts
  fl_chart: ^0.70.2

  # Location
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/Video/
    - assets/pop_n_slash_images/
    - assets/sounds/